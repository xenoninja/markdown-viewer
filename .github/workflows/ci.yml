name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  stable:
    name: stable / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust with required components
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Select stable Rust
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint all targets
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run the supported test suite
        run: cargo test --all-targets --all-features

      - name: Verify Cargo installation
        run: cargo install --path . --locked --root target/cargo-install

      - name: Verify the installed executable
        run: target/cargo-install/bin/mdview --version

[package]
name = "mdview"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A read-only terminal Markdown viewer"
license = "MIT"
readme = "README.md"
keywords = ["cli", "markdown", "terminal", "tui", "viewer"]
categories = ["command-line-utilities", "text-processing"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "src/**", "tests/**"]

[dependencies]
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
pulldown-cmark = "0.13.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-casefold = "0.2.0"
unicode-width = "0.2.2"
unicode-segmentation = "1.12.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
nix = { version = "0.31.3", features = ["fs", "process", "term"] }
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
